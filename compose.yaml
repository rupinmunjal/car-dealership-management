# Docker Compose Template (Adapted for Spring Boot + Angular + Postgres)
# Multi-Environment Deployment Configuration
# ============================================

services:
  # ==========================================
  # STAGING ENVIRONMENT
  # ==========================================
  # Purpose: Testing new features before production
  # URL: http://localhost:5000
  # ==========================================
  staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-dealership-staging
    ports:
      # Maps Host 5000 -> Container 8080 (Spring Boot default)
      - "5000:8080"
    environment:
      # Spring Boot Configuration (must match the database service credentials below)
      # Use the Docker service name 'database' and the internal container port 5432.
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/carsdb
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-cars}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-localdev}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      # SITE_ADMIN Bootstrap (first-run account creation)
      - SITE_ADMIN_EMAIL=${SITE_ADMIN_EMAIL}
      - SITE_ADMIN_PASSWORD=${SITE_ADMIN_PASSWORD}
      # Ensure Health Endpoint is exposed for Docker Healthcheck
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # Checks the Spring Boot Actuator Health Endpoint
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================
  # PRODUCTION ENVIRONMENT
  # ==========================================
  # Purpose: Stable release for end users
  # URL: http://localhost:6001
  # ==========================================
  production:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-dealership-production
    ports:
      # Maps Host 6001 -> Container 8080 (Spring Boot default)
      - "6001:8080"
    environment:
      # Spring Boot Configuration
      # Use the Docker service name 'database' and the internal container port 5432.
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/carsdb
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-cars}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-localdev}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update  # For Docker environment, auto-create schema
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      # SITE_ADMIN Bootstrap (first-run account creation)
      - SITE_ADMIN_EMAIL=${SITE_ADMIN_EMAIL}
      - SITE_ADMIN_PASSWORD=${SITE_ADMIN_PASSWORD}
      # Ensure Health Endpoint is exposed
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================
  # DATABASE SERVICE (Required)
  # ==========================================
  database:
    image: postgres:16-alpine
    container_name: car-dealership-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cars}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localdev}
      - POSTGRES_DB=${POSTGRES_DB:-carsdb}
    ports:
      # Use host port 5433 to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-cars}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

# ==========================================
# NETWORKS
# ==========================================
networks:
  app-network:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================
volumes:
  db-data: