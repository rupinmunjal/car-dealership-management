services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-carsdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cars}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cars-local-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-DdHcnCpz5Ofm9QiSbEopDNO1yuE2jfPSVdPcJPdWcdhrQ4/rZhgSHDgIbqsw/X62v7qWP8FJ8ttr/D9SW3PfTw==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SITE_ADMIN_EMAIL: ${SITE_ADMIN_EMAIL:-admin@dealership.local}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-Admin123!}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,prometheus
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cars-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-carsdb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
