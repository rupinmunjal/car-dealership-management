name: Staging Deployment

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  test:
    name: Run Java Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        run: ./mvnw test

  angular-build:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Angular build
        run: npm run build -- --configuration production

  staging-docker:
    name: Staging Docker Build & Verify
    runs-on: ubuntu-latest
    needs: [test, angular-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start staging container
        run: |
          docker compose build staging
          docker compose up staging -d
          echo "Waiting 20s for Spring Boot to start..."
          sleep 20

      - name: Verify staging deployment
        run: |
          echo "Checking staging health endpoint..."
          curl -f http://localhost:5000/actuator/health || exit 1

          echo "Checking staging responds..."
          curl -s http://localhost:5000/
          echo "✅ Staging deployment verified!"

      - name: Run smoke tests
        run: |
          echo "Running post-deployment smoke tests..."
          STATUS=$(curl -s http://localhost:5000/actuator/health | grep "UP")
          if [ -z "$STATUS" ]; then echo "❌ Health check failed"; exit 1; fi

          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:5000/index.html)
          if [ "$HTTP_CODE" != "200" ]; then echo "❌ Index page failed (Code: $HTTP_CODE)"; exit 1; fi

          echo "✅ All Staging smoke tests passed!"

      - name: Cleanup
        if: always()
        run: docker compose down

  staging-summary:
    name: Staging Summary
    runs-on: ubuntu-latest
    needs: [test, angular-build, staging-docker]

    steps:
      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "  STAGING DEPLOYMENT READY"
          echo "============================================"
          echo "  Branch:      staging"
          echo "  URL:         http://localhost:5000"
          echo "============================================"
