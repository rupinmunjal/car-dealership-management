name: Staging Deployment

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  test:
    name: Run Java Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        run: ./mvnw verify

      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-java-test-reports
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 14

  angular-build:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Angular build
        run: npm run build -- --configuration production

  staging-docker:
    name: Staging Docker Build & Verify
    runs-on: ubuntu-latest
    needs: [test, angular-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and start staging container
        run: docker compose up --build --detach --wait app

      - name: Verify staging deployment
        run: |
          echo "Checking staging health endpoint..."
          curl --fail http://localhost:8080/actuator/health

          echo "Checking staging responds..."
          curl --silent http://localhost:8080/
          echo "✅ Staging deployment verified!"

      - name: Run smoke tests
        run: |
          echo "Running post-deployment smoke tests..."
          STATUS=$(curl --silent http://localhost:8080/actuator/health | grep "UP")
          if [ -z "$STATUS" ]; then echo "❌ Health check failed"; exit 1; fi

          HTTP_CODE=$(curl --output /dev/null --silent --write-out "%{http_code}\n" http://localhost:8080/index.html)
          if [ "$HTTP_CODE" != "200" ]; then echo "❌ Index page failed (Code: $HTTP_CODE)"; exit 1; fi

          echo "✅ All Staging smoke tests passed!"

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  staging-summary:
    name: Staging Summary
    runs-on: ubuntu-latest
    needs: [test, angular-build, staging-docker]

    steps:
      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "  STAGING DEPLOYMENT READY"
          echo "============================================"
          echo "  Branch:      staging"
          echo "  URL:         http://localhost:8080"
          echo "============================================"
