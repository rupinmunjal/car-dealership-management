name: Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        run: mvn verify

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Basic check for hardcoded secrets
      - name: Check for hardcoded secrets
        run: |
          if grep -rn "password\s*=\s*['\"]" --include="*.java" . 2>/dev/null; then
            echo "⚠️ WARNING: Potential hardcoded password found!"
          else
            echo "✅ No obvious hardcoded passwords found"
          fi

  production-docker:
    name: Production Docker Build & Verify
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start production container
        run: |
          docker compose build production
          docker compose up -d production database

      - name: Wait for services to be ready
        run: |
          echo "Waiting for database to be healthy..."
          timeout 60 bash -c 'until docker inspect car-dealership-db --format="{{.State.Health.Status}}" 2>/dev/null | grep -q "healthy"; do echo "Waiting for database..."; sleep 3; done'
          echo "✅ Database is healthy!"
          
          echo ""
          echo "Waiting for production container to start (max 90 seconds)..."
          
          for i in {1..18}; do
            STATUS=$(docker inspect car-dealership-production --format="{{.State.Status}}" 2>/dev/null || echo "unknown")
            HEALTH=$(docker inspect car-dealership-production --format="{{.State.Health.Status}}" 2>/dev/null || echo "none")
            
            echo "Attempt $i/18: Status=$STATUS, Health=$HEALTH"
            
            if [ "$STATUS" = "running" ] && [ "$HEALTH" = "healthy" ]; then
              echo "✅ Container is running and healthy!"
              break
            fi
            
            if [ "$STATUS" = "restarting" ] || [ "$STATUS" = "exited" ]; then
              echo "❌ Container is $STATUS - showing logs:"
              docker compose logs production
              exit 1
            fi
            
            sleep 5
          done
          
          # Final check
          STATUS=$(docker inspect car-dealership-production --format="{{.State.Status}}" 2>/dev/null)
          if [ "$STATUS" != "running" ]; then
            echo "❌ Container failed to start properly"
            docker compose logs production
            exit 1
          fi
          
      - name: Show container status and logs
        run: |
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== Production Logs (last 100 lines) ==="
          docker compose logs --tail=100 production

      - name: Verify production deployment
        run: |
          echo "Checking production health endpoint..."
          curl -f http://localhost:6001/actuator/health || exit 1
          echo "✅ Production deployment verified!"

      - name: Verify production security
        run: |
          # Check that detailed errors are not exposed
          RESPONSE=$(curl -s http://localhost:6001/nonexistent-endpoint-12345)
          if echo "$RESPONSE" | grep -qi "stack\|trace\|exception"; then
            echo "⚠️ WARNING: Stack traces may be exposed in production!"
          else
            echo "✅ No stack traces exposed in error responses"
          fi

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against production..."
          
          # 1. Verify Health
          STATUS=$(curl -s http://localhost:6001/actuator/health | grep "UP")
          if [ -z "$STATUS" ]; then echo "❌ Health check failed"; exit 1; fi
          
          # 2. Verify Index
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:6001/index.html)
          if [ "$HTTP_CODE" != "200" ]; then echo "❌ Index page failed (Code: $HTTP_CODE)"; exit 1; fi
          
          echo "✅ Smoke tests passed!"

      - name: Cleanup
        if: always()
        run: docker compose down

  production-summary:
    name: Production Summary
    runs-on: ubuntu-latest
    needs: [test, security, production-docker]
    
    steps:
      - name: Create Release Summary
        run: |
          echo "============================================"
          echo "  PRODUCTION DEPLOYMENT READY"
          echo "============================================"
          echo "  Branch:      main"
          echo "  Environment: PRODUCTION"
          echo "  Port:        6001"
          echo "============================================"