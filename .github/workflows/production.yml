name: Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run All Java Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        run: ./mvnw verify

      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-java-test-reports
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 14

  angular-build:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Angular build
        run: npm run build -- --configuration production

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "password\\s*=\\s*['\"]" --include="*.java" . 2>/dev/null; then
            echo "⚠️ WARNING: Potential hardcoded password found!"
          else
            echo "✅ No obvious hardcoded passwords found"
          fi

  production-docker:
    name: Production Docker Build & Verify
    runs-on: ubuntu-latest
    needs: [test, angular-build, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and start production container
        run: docker compose up --build --detach --wait app

      - name: Wait for services to be ready
        run: |
          docker compose ps
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused \
            http://localhost:8080/actuator/health

      - name: Show container status and logs
        run: |
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== Production Logs (last 100 lines) ==="
          docker compose logs --tail=100 app

      - name: Verify production deployment
        run: |
          echo "Checking production health endpoint..."
          curl --fail http://localhost:8080/actuator/health
          echo "✅ Production deployment verified!"

      - name: Verify production security
        run: |
          RESPONSE=$(curl --silent http://localhost:8080/nonexistent-endpoint-12345)
          if echo "$RESPONSE" | grep -qi "stack\\|trace\\|exception"; then
            echo "⚠️ WARNING: Stack traces may be exposed in production!"
          else
            echo "✅ No stack traces exposed in error responses"
          fi

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against production..."

          STATUS=$(curl --silent http://localhost:8080/actuator/health | grep "UP")
          if [ -z "$STATUS" ]; then echo "❌ Health check failed"; exit 1; fi

          HTTP_CODE=$(curl --output /dev/null --silent --write-out "%{http_code}\n" http://localhost:8080/index.html)
          if [ "$HTTP_CODE" != "200" ]; then echo "❌ Index page failed (Code: $HTTP_CODE)"; exit 1; fi

          echo "✅ Smoke tests passed!"

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  production-summary:
    name: Production Summary
    runs-on: ubuntu-latest
    needs: [test, angular-build, security, production-docker]

    steps:
      - name: Create Release Summary
        run: |
          echo "============================================"
          echo "  PRODUCTION DEPLOYMENT READY"
          echo "============================================"
          echo "  Branch:      ${{ github.head_ref || github.ref_name }}"
          echo "  Environment: PRODUCTION"
          echo "  Port:        8080"
          echo "============================================"
