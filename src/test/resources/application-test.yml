spring:
  cache:
    type: simple

  data:
    redis:
      repositories:
        enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

app:
  jwt:
    secret: DdHcnCpz5Ofm9QiSbEopDNO1yuE2jfPSVdPcJPdWcdhrQ4/rZhgSHDgIbqsw/X62v7qWP8FJ8ttr/D9SW3PfTw==
    # Use a short expiration for tests so token-lifetime tests run quickly.
    expiration-ms: 60000

# Prevent DataInitializer from crashing the test context.
SITE_ADMIN_EMAIL: test-siteadmin@example.com
SITE_ADMIN_PASSWORD: test-password-123

management:
  health:
    redis:
      enabled: false
