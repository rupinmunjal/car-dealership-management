<div class="app-page page-enter">

  <app-page-header label="Inventory" title="Cars Inventory"
                   subtitle="Manage and view all cars in the dealership">
    <ng-container header-actions>
      <app-btn *ngIf="isAdmin" icon="add" routerLink="/cars/add">Add Car</app-btn>
    </ng-container>
  </app-page-header>

  <!-- Stats -->
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6">
    <app-stat-card icon="directions_car" color="blue" label="Total Cars" [value]="cars.length" sub="In inventory"/>
    <app-stat-card icon="check_circle" color="green" label="Available" [value]="cars.length" sub="Listed now"/>
    <app-stat-card class="col-span-2 sm:col-span-1" icon="local_offer" color="purple" label="Brands" [value]="uniqueBrandsCount" sub="Unique makes"/>
  </div>

  <!-- Table -->
  <app-data-table [rows]="cars" emptyIcon="directions_car" emptyTitle="No cars found"
                  emptyText="Get started by adding your first vehicle."
                  [emptyActionLink]="isAdmin ? '/cars/add' : undefined"
                  emptyActionLabel="Add First Car"
                  [emptyActionHidden]="!isAdmin">
    <thead>
      <tr>
        <th>ID</th>
        <th>Make</th>
        <th>Model</th>
        <th>Year</th>
        <th *ngIf="isAdmin">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let car of cars">
        <td class="text-gray-400 text-xs font-mono">{{ car.id }}</td>
        <td>
          <div class="flex items-center gap-3">
            <app-avatar [name]="car.make" color="blue" [size]="32"/>
            <span class="font-medium text-gray-900">{{ car.make }}</span>
          </div>
        </td>
        <td class="text-gray-600">{{ car.model }}</td>
        <td><span class="chip chip-brand">{{ car.modelYear }}</span></td>
        <td *ngIf="isAdmin">
          <app-btn variant="danger" icon="delete" ariaLabel="Delete car" title="Delete car"
                   (clicked)="deleteCar(car.id)"/>
        </td>
      </tr>
    </tbody>
  </app-data-table>

</div>
