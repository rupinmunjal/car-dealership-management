<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
      <mat-card-subtitle>Join the dealership platform</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="auth-form">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" [(ngModel)]="user.email" name="email" required
                 placeholder="your.email@example.com">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error>Valid email is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'"
                 [(ngModel)]="user.password" name="password" required minlength="6">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword = !hidePassword"
                  [attr.aria-label]="'Toggle password visibility'">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>At least 6 characters</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'"
                 [(ngModel)]="user.confirmPassword" name="confirmPassword" required>
          <mat-icon matPrefix>check_circle</mat-icon>
        </mat-form-field>

        <div *ngIf="error" class="error-message">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error }}</span>
        </div>

        <button mat-flat-button color="primary" type="submit"
                class="full-width submit-btn" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20" class="spinner-inline"></mat-spinner>
          <span *ngIf="!loading">Create Account</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <span class="muted">Already have an account?</span>
      <a mat-button color="primary" routerLink="/login">Sign In</a>
    </mat-card-actions>
  </mat-card>
</div>
