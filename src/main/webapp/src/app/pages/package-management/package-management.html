<mat-toolbar color="primary"><span>📦 Packages</span><span class="spacer"></span><button mat-flat-button (click)="openCreateDialog()"><mat-icon>add</mat-icon> New Package</button></mat-toolbar>
<div class="page-container">
  <table mat-table [dataSource]="packages" class="full-width-table">
    <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let p">{{ p.name }}</td></ng-container>
    <ng-container matColumnDef="seats"><th mat-header-cell *matHeaderCellDef>Seats</th><td mat-cell *matCellDef="let p">{{ p.maxEmployeeSeats }}</td></ng-container>
    <ng-container matColumnDef="listings"><th mat-header-cell *matHeaderCellDef>Listings</th><td mat-cell *matCellDef="let p">{{ p.maxCarListings }}</td></ng-container>
    <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let p"><button mat-icon-button color="warn" (click)="deletePackage(p.id)" matTooltip="Delete"><mat-icon>delete</mat-icon></button></td></ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr><tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
<ng-template #dialogTemplate>
  <h2 mat-dialog-title>{{ editingId ? 'Edit' : 'Create' }} Package</h2>
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width"><mat-label>Name</mat-label><input matInput [(ngModel)]="form.name"></mat-form-field>
    <mat-form-field appearance="outline" class="full-width"><mat-label>Max Seats</mat-label><input matInput type="number" [(ngModel)]="form.maxEmployeeSeats"></mat-form-field>
    <mat-form-field appearance="outline" class="full-width"><mat-label>Max Listings</mat-label><input matInput type="number" [(ngModel)]="form.maxCarListings"></mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end"><button mat-button (click)="dialogRef?.close()">Cancel</button><button mat-flat-button color="primary" (click)="save()">Save</button></mat-dialog-actions>
</ng-template>
