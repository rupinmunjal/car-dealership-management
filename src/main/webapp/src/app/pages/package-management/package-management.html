<div class="app-page page-enter">

  <app-page-header label="Subscriptions" title="Subscription Packages"
                   subtitle="Define limits for each subscription tier">
    <ng-container header-actions>
      <app-btn icon="add" (clicked)="openCreateDialog()">New Package</app-btn>
    </ng-container>
  </app-page-header>

  <!-- Table -->
  <app-data-table [rows]="packages" [fixedLayout]="true"
                  emptyIcon="inventory_2" emptyTitle="No packages defined"
                  emptyText="Create your first subscription package."
                  emptyActionLabel="Create Package"
                  (emptyActionClick)="openCreateDialog()">
    <thead>
      <tr>
        <th class="w-[28%]">Package</th>
        <th class="w-[26%]">Employee Seats</th>
        <th class="w-[30%]">Car Listings</th>
        <th class="w-[16%] !text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of packages">
        <td>
          <div class="flex items-center gap-3">
            <app-avatar [name]="p.name" color="purple" [size]="36"/>
            <span class="font-semibold text-gray-900">{{ p.name }}</span>
          </div>
        </td>
        <td><span class="chip chip-brand min-w-[116px] justify-center"><mat-icon class="chip-icon">person</mat-icon> {{ p.maxEmployeeSeats }} seats</span></td>
        <td><span class="chip chip-amber min-w-[116px] justify-center"><mat-icon class="chip-icon">directions_car</mat-icon> {{ p.maxCarListings }} listings</span></td>
        <td class="!text-center">
          <app-btn variant="danger" icon="delete" ariaLabel="Delete package" title="Delete package"
                   (clicked)="deletePackage(p.id)"/>
        </td>
      </tr>
    </tbody>
  </app-data-table>

</div>

<ng-template #dialogTemplate>
  <h2 mat-dialog-title class="!text-lg !font-semibold">{{ editingId ? 'Edit' : 'Create' }} Package</h2>
  <mat-dialog-content>
    <div class="flex flex-col gap-4 min-w-[320px] pt-2">
      <mat-form-field appearance="outline">
        <mat-label>Package Name</mat-label>
        <input matInput [(ngModel)]="form.name" placeholder="e.g. Starter">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Max Employee Seats</mat-label>
        <input matInput type="number" [(ngModel)]="form.maxEmployeeSeats" min="1">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Max Car Listings</mat-label>
        <input matInput type="number" [(ngModel)]="form.maxCarListings" min="1">
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="!px-6 !pb-5">
    <app-btn variant="ghost" (clicked)="dialogRef?.close()">Cancel</app-btn>
    <app-btn (clicked)="save()">{{ editingId ? 'Update' : 'Create' }}</app-btn>
  </mat-dialog-actions>
</ng-template>
