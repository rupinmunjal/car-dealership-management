<div class="app-page app-page-form page-enter">

  <app-page-header label="Inventory" title="Add New Car"
                   subtitle="Add a vehicle to the dealership inventory">
    <ng-container header-actions>
      <app-btn variant="outline" icon="arrow_back" routerLink="/cars">Back</app-btn>
    </ng-container>
  </app-page-header>

  <app-alert type="success" [message]="message" [dismissible]="true" (dismissed)="message = ''"/>
  <app-alert type="error" [message]="error" [dismissible]="true" (dismissed)="error = ''"/>

  <mat-card class="form-card">
    <form #carForm="ngForm" (ngSubmit)="onSubmit()" class="p-6 space-y-5">

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Make</mat-label>
        <mat-icon matPrefix>directions_car</mat-icon>
        <input matInput type="text" [(ngModel)]="car.make" name="make" required placeholder="e.g. Toyota, BMW">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Price (Optional)</mat-label>
        <mat-icon matPrefix>payments</mat-icon>
        <input matInput type="number" [(ngModel)]="car.price" name="price" min="0" step="0.01" placeholder="e.g. 28999">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Model</mat-label>
        <mat-icon matPrefix>model_training</mat-icon>
        <input matInput type="text" [(ngModel)]="car.model" name="model" required placeholder="e.g. Camry, X5">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Model Year</mat-label>
        <mat-icon matPrefix>calendar_today</mat-icon>
        <input matInput type="number" [(ngModel)]="car.modelYear" name="modelYear" required min="1900" max="2030" placeholder="e.g. 2026">
      </mat-form-field>

      @if (isSiteAdmin) {
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Assign to Dealer</mat-label>
          <mat-select [(ngModel)]="selectedDealerId" name="dealerId" required placeholder="Select a dealer...">
            <mat-option *ngFor="let dealer of dealers" [value]="dealer.id">{{ dealer.name }} — {{ dealer.location }}</mat-option>
          </mat-select>
        </mat-form-field>
      }

      <div class="flex gap-3 pt-2">
        <app-btn type="submit" [disabled]="carForm.invalid || selectedDealerId === null"
                 [loading]="submitting" icon="add">Add Car</app-btn>
        <app-btn variant="outline" icon="refresh" type="button" (clicked)="resetForm()">Reset</app-btn>
      </div>

    </form>
  </mat-card>

</div>
