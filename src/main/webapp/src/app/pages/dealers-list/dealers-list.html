<div class="app-page page-enter">

  <app-page-header label="Network" title="Dealers"
                   subtitle="Manage all dealerships in the network">
    <ng-container header-actions>
      <app-btn *ngIf="isAdmin" icon="add_business" routerLink="/dealers/register">Register Dealer</app-btn>
    </ng-container>
  </app-page-header>

  <!-- Stats -->
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6">
    <app-stat-card icon="business" color="blue" label="Total Dealers" [value]="dealers.length" sub="In network"/>
    <app-stat-card icon="location_on" color="green" label="Locations" [value]="dealers.length" sub="Dealership sites"/>
    <app-stat-card class="col-span-2 sm:col-span-1" icon="directions_car" color="purple" label="Inventory" [value]="totalInventory" sub="Cars across dealers"/>
  </div>

  <!-- Table -->
  <app-data-table [rows]="dealers" emptyIcon="store" emptyTitle="No dealers yet"
                  emptyText="Register your first dealership to get started."
                  [emptyActionLink]="isAdmin ? '/dealers/register' : undefined"
                  emptyActionLabel="Register Dealer"
                  [emptyActionHidden]="!isAdmin">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Location</th>
        <th>Cars</th>
        <th *ngIf="isAdmin">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of dealers">
        <td class="text-gray-400 text-xs font-mono">{{ d.id }}</td>
        <td>
          <div class="flex items-center gap-3">
            <app-avatar [name]="d.name" color="purple" [size]="32"/>
            <span class="min-w-0">
              <span class="block font-medium text-gray-900">{{ d.name }}</span>
              <span class="mt-0.5 flex items-center gap-1 text-xs text-gray-500">
                <mat-icon class="chip-icon !text-[13px] text-gray-400">mail_outline</mat-icon>
                {{ d.adminEmail || 'No admin assigned' }}
              </span>
            </span>
          </div>
        </td>
        <td>
          <span class="flex items-center gap-1 text-gray-500">
            <mat-icon class="text-[14px] w-3.5 h-3.5 text-gray-400">location_on</mat-icon>
            {{ d.location }}
          </span>
        </td>
        <td><span class="chip chip-brand">{{ d.cars ? d.cars.length : 0 }}</span></td>
        <td *ngIf="isAdmin">
          <app-btn variant="danger" icon="delete" ariaLabel="Delete dealer" title="Delete dealer"
                   (clicked)="deleteDealer(d.id)"/>
        </td>
      </tr>
    </tbody>
  </app-data-table>

</div>
