<mat-toolbar color="accent"><span>👥 Employee Management</span></mat-toolbar>
<div class="page-container">
  <div class="header-row">
    <h2>Employees</h2>
    <button mat-flat-button color="primary" (click)="openCreateDialog()"><mat-icon>person_add</mat-icon> Add Employee</button>
  </div>

  <div *ngIf="message" class="alert alert-success"><mat-icon>check_circle</mat-icon>{{ message }}</div>
  <div *ngIf="error" class="alert alert-error"><mat-icon>error</mat-icon>{{ error }}</div>

  <mat-table [dataSource]="employees" class="mat-elevation-z1">
    <ng-container matColumnDef="id"><mat-header-cell *matHeaderCellDef>ID</mat-header-cell><mat-cell *matCellDef="let e">{{ e.id }}</mat-cell></ng-container>
    <ng-container matColumnDef="email"><mat-header-cell *matHeaderCellDef>Email</mat-header-cell><mat-cell *matCellDef="let e">{{ e.email }}</mat-cell></ng-container>
    <ng-container matColumnDef="role"><mat-header-cell *matHeaderCellDef>Role</mat-header-cell><mat-cell *matCellDef="let e"><mat-chip>{{ e.role }}</mat-chip></mat-cell></ng-container>
    <ng-container matColumnDef="active"><mat-header-cell *matHeaderCellDef>Status</mat-header-cell><mat-cell *matCellDef="let e"><mat-chip [color]="e.active ? 'primary' : 'warn'" highlighted>{{ e.active ? 'Active' : 'Deactivated' }}</mat-chip></mat-cell></ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let e">
        <button mat-icon-button matTooltip="Edit Permissions" (click)="openPermissionsDialog(e)"><mat-icon>shield</mat-icon></button>
        <button mat-icon-button matTooltip="{{ e.active ? 'Deactivate' : 'Reactivate' }}" (click)="toggleActive(e)"><mat-icon>{{ e.active ? 'block' : 'check_circle' }}</mat-icon></button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: columns"></mat-row>
    <tr class="mat-row" *matNoDataRow><td class="mat-cell" [colSpan]="columns.length">No employees found</td></tr>
  </mat-table>
</div>

<ng-template #createDialog>
  <h2 mat-dialog-title>Create Employee</h2>
  <mat-dialog-content>
    <div class="form-layout">
      <mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput [(ngModel)]="createForm.email" name="email"></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Password</mat-label><input matInput type="password" [(ngModel)]="createForm.password" name="password"></mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" (click)="createEmployee()">Create</button>
  </mat-dialog-actions>
</ng-template>

<ng-template #permissionsDialog>
  <h2 mat-dialog-title>Permissions for {{ editingEmployee?.email }}</h2>
  <mat-dialog-content>
    <div class="form-layout">
      <mat-slide-toggle *ngFor="let p of availablePermissions" [checked]="selectedPermissions.includes(p)" (change)="togglePermission(p)">{{ p }}</mat-slide-toggle>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" (click)="savePermissions()">Save</button>
  </mat-dialog-actions>
</ng-template>
