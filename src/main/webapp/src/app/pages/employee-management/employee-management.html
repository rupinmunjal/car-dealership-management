<div class="app-page page-enter">

  <app-page-header label="Team" title="Employee Management"
                   subtitle="Manage your team, roles, permissions, and account status">
    <ng-container header-actions>
      <app-btn icon="person_add" (clicked)="openCreateDialog()">Add Employee</app-btn>
    </ng-container>
  </app-page-header>

  <!-- Messages -->
  <app-alert type="success" [message]="message" [dismissible]="true" (dismissed)="message = ''"/>
  <app-alert type="error" [message]="error" [dismissible]="true" (dismissed)="error = ''"/>

  <!-- Table -->
  <app-data-table [rows]="employees" emptyIcon="people_outline" emptyTitle="No employees yet"
                  emptyText="Add team members to help manage your dealership."
                  emptyActionLabel="Add Employee"
                  (emptyActionClick)="openCreateDialog()">
    <thead>
      <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of employees">
        <td class="text-gray-400 text-xs font-mono">{{ e.id }}</td>
        <td>
          <div class="flex items-center gap-3">
            <app-avatar [name]="e.email" color="amber" [size]="32"/>
            <span class="font-medium text-gray-900">{{ e.email }}</span>
          </div>
        </td>
        <td><span [class]="roleChipClass(e.role)">{{ roleLabel(e.role) }}</span></td>
        <td><span [class]="statusChipClass(e.active)">{{ e.active ? 'Active' : 'Deactivated' }}</span></td>
        <td>
          <div class="flex gap-1">
            <app-btn variant="ghost" icon="shield" title="Manage permissions" ariaLabel="Manage permissions"
                     (clicked)="openPermissionsDialog(e)"/>
            <app-btn variant="ghost" icon="block" title="Deactivate" ariaLabel="Deactivate"
                     (clicked)="deactivateEmployee(e)"/>
          </div>
        </td>
      </tr>
    </tbody>
  </app-data-table>

  <!-- Empty state action button (since emptyActionLink doesn't work for dialog) -->
  <!-- Handled via custom empty state action in the component -->
</div>

<ng-template #createDialog>
  <h2 mat-dialog-title class="!text-lg !font-semibold">Create Employee</h2>
  <mat-dialog-content>
    <div class="flex flex-col gap-4 min-w-[320px] pt-2">
      <mat-form-field appearance="outline">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" [(ngModel)]="createForm.email" name="email">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="createForm.password" name="password">
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="!px-6 !pb-5">
    <app-btn variant="ghost" (clicked)="dialogRef?.close()">Cancel</app-btn>
    <app-btn (clicked)="createEmployee()">Create</app-btn>
  </mat-dialog-actions>
</ng-template>

<ng-template #permissionsDialog>
  <h2 mat-dialog-title class="!text-lg !font-semibold">Permissions for {{ editingEmployee?.email }}</h2>
  <mat-dialog-content>
    <p class="text-sm text-gray-500 mb-4">Toggle permissions to control access.</p>
    <div class="flex flex-col gap-3 min-w-[300px]">
      <mat-slide-toggle *ngFor="let p of availablePermissions"
                        [checked]="selectedPermissions.includes(p)"
                        (change)="togglePermission(p)"
                        color="primary">{{ p }}</mat-slide-toggle>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="!px-6 !pb-5">
    <app-btn variant="ghost" (clicked)="dialogRef?.close()">Cancel</app-btn>
    <app-btn (clicked)="savePermissions()">Save</app-btn>
  </mat-dialog-actions>
</ng-template>
