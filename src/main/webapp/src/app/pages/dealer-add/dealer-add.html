<div class="app-page app-page-form page-enter">

  <app-page-header label="Network" title="Add New Dealer"
                   subtitle="Add a new dealer to the network">
    <ng-container header-actions>
      <app-btn variant="outline" icon="arrow_back" routerLink="/dealers">Back to Dealers</app-btn>
    </ng-container>
  </app-page-header>

  <app-alert type="success" [message]="message" [dismissible]="true" (dismissed)="message = ''"/>
  <app-alert type="error" [message]="error" [dismissible]="true" (dismissed)="error = ''"/>

  <mat-card class="form-card">
    <form #dealerForm="ngForm" (ngSubmit)="onSubmit()" class="p-6 space-y-5">

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Dealer Name</mat-label>
        <mat-icon matPrefix>business</mat-icon>
        <input matInput [(ngModel)]="dealer.name" name="name" required placeholder="e.g. AutoMax Dealership">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Location</mat-label>
        <mat-icon matPrefix>location_on</mat-icon>
        <input matInput [(ngModel)]="dealer.location" name="location" required placeholder="e.g. Toronto, ON">
      </mat-form-field>

      <div class="flex gap-3 pt-2">
        <app-btn type="submit" [loading]="submitting" icon="add" class="w-full sm:w-auto">Add Dealer</app-btn>
        <app-btn variant="outline" icon="refresh" type="button" (clicked)="resetForm()">Reset</app-btn>
      </div>

    </form>
  </mat-card>

</div>
