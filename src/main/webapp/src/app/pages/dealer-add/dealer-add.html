<div class="page-container form-page-container">
  <div class="page-header">
    <div>
      <h2 class="page-title">🏢 Add New Dealer</h2>
      <p class="page-subtitle">Add a new dealer to the network</p>
    </div>
    <div class="page-actions">
      <a mat-stroked-button routerLink="/dealers"><mat-icon>arrow_back</mat-icon> Back to Dealers</a>
      <a mat-stroked-button routerLink="/"><mat-icon>home</mat-icon> Home</a>
    </div>
  </div>

  <mat-card appearance="outlined" class="form-card">
    <mat-card-header>
      <mat-card-title>Dealer Information</mat-card-title>
      <mat-card-subtitle>Fill in the details to add a new dealer</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="message" class="alert alert-success">
        <mat-icon>check_circle</mat-icon> {{ message }}
      </div>
      <div *ngIf="error" class="alert alert-error">
        <mat-icon>error</mat-icon> {{ error }}
      </div>

      <form (ngSubmit)="onSubmit()" class="form-layout">
        <mat-form-field appearance="outline">
          <mat-label>Dealer Name</mat-label>
          <input matInput [(ngModel)]="dealer.name" name="name" required placeholder="e.g. AutoMax Dealership">
          <mat-icon matPrefix>business</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Location</mat-label>
          <input matInput [(ngModel)]="dealer.location" name="location" required placeholder="e.g. Toronto, ON">
          <mat-icon matPrefix>location_on</mat-icon>
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit">
            <mat-icon>add</mat-icon> Add Dealer
          </button>
          <button mat-stroked-button type="button" (click)="resetForm()">
            <mat-icon>refresh</mat-icon> Reset
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
