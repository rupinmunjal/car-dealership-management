<div class="app-page app-page-form page-enter">

  <app-page-header label="Configuration" title="Dealer Settings"
                   subtitle="Update your dealership's public profile."/>

  <app-alert type="success" [message]="message" [dismissible]="true" (dismissed)="message = ''"/>
  <app-alert type="error" [message]="error" [dismissible]="true" (dismissed)="error = ''"/>

  <mat-card class="form-card">
    <form (ngSubmit)="onSubmit()" class="p-6 space-y-5">

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Display Name</mat-label>
        <mat-icon matPrefix>business</mat-icon>
        <input matInput [(ngModel)]="form.displayName" name="displayName" placeholder="e.g. Downtown Motors Toronto">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Description</mat-label>
        <mat-icon matPrefix>description</mat-icon>
        <textarea matInput [(ngModel)]="form.description" name="description" rows="3" placeholder="Tell customers about your dealership..."></textarea>
      </mat-form-field>

      <mat-slide-toggle [(ngModel)]="form.visible" name="visible" color="primary" class="block">
        <span class="text-sm font-medium text-gray-700">Visible to public</span>
      </mat-slide-toggle>

      <div class="pt-2">
        <app-btn type="submit" [loading]="submitting" icon="save" class="w-full sm:w-auto">Save Settings</app-btn>
      </div>

    </form>
  </mat-card>

</div>
