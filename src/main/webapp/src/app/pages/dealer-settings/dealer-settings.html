<mat-toolbar color="accent">
  <button mat-icon-button routerLink="/dashboard/dealer">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Dealer Settings</span>
</mat-toolbar>

<div class="page-container">
  <div class="page-header">
    <div>
      <h2 class="page-title">Configure Dealership</h2>
      <p class="page-subtitle">Update your dealership's public profile and visibility settings.</p>
    </div>
  </div>

  <mat-card appearance="outlined" class="form-card">
    <mat-card-content>
      <div *ngIf="message" class="alert alert-success">
        <mat-icon>check_circle</mat-icon> {{ message }}
      </div>
      <div *ngIf="error" class="alert alert-error">
        <mat-icon>error</mat-icon> {{ error }}
      </div>

      <form (ngSubmit)="onSubmit()" class="form-layout">
        <mat-form-field appearance="outline">
          <mat-label>Display Name</mat-label>
          <input matInput [(ngModel)]="form.displayName" name="displayName" placeholder="e.g. Downtown Motors Toronto">
          <mat-icon matPrefix>badge</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <textarea matInput [(ngModel)]="form.description" name="description" rows="3" placeholder="Tell customers about your dealership..."></textarea>
          <mat-icon matPrefix>description</mat-icon>
        </mat-form-field>

        <mat-slide-toggle [(ngModel)]="form.visible" name="visible" color="primary">
          <span style="font-weight: 500;">Visible to public</span>
        </mat-slide-toggle>

        <button mat-flat-button color="primary" type="submit">
          <mat-icon>save</mat-icon> Save Settings
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
