<div class="app-page page-enter">

  <app-page-header label="Workspace" title="My Workspace" [showDashboard]="false"
                   subtitle="Your permissions determine what you can access."/>

  <!-- Permissions card -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-6">
    <h2 class="text-xs font-semibold uppercase tracking-[0.12em] text-gray-400 mb-4">Your Permissions</h2>
    <div class="flex flex-wrap gap-2">
      <span *ngFor="let p of permissions" class="chip chip-brand">
        <span class="w-1.5 h-1.5 rounded-full bg-brand-600 inline-block"></span>
        {{ permissionLabel(p) }}
      </span>
      <span *ngIf="permissions.length === 0" class="chip chip-gray">
        <mat-icon class="text-[14px] w-4 h-4">visibility</mat-icon> View only
      </span>
    </div>
  </div>

  <!-- Action cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <a routerLink="/cars"
       class="group block bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 p-6 no-underline">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4 group-hover:scale-105 transition-transform gradient-blue shadow-sm">
        <mat-icon class="text-white">directions_car</mat-icon>
      </div>
      <h3 class="text-base font-semibold text-gray-900 group-hover:text-brand-600 transition-colors">View Cars</h3>
      <p class="mt-1 text-sm text-gray-500">Browse the full dealership inventory</p>
    </a>

    <a *ngIf="canAddCar" routerLink="/cars/add"
       class="group block bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 p-6 no-underline">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4 group-hover:scale-105 transition-transform gradient-blue shadow-sm">
        <mat-icon class="text-white">add_circle</mat-icon>
      </div>
      <h3 class="text-base font-semibold text-gray-900 group-hover:text-brand-600 transition-colors">Add New Car</h3>
      <p class="mt-1 text-sm text-gray-500">Add vehicles to your dealership inventory</p>
    </a>
  </div>
</div>
