<div class="app-page page-enter">

  <app-page-header label="Overview" title="Your Dealership" [showDashboard]="false"
                   subtitle="Manage inventory, team, and settings from one place."/>

  <!-- Stats -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <app-stat-card icon="directions_car" color="blue" label="Cars" [value]="carCount" sub="In inventory"/>
    <app-stat-card icon="people" color="green" label="Employees" [value]="employeeCount" sub="Team members"/>
    <app-stat-card icon="inventory_2" color="purple" label="Package" [value]="packageName || '—'" [sub]="packageLimits"/>
    <app-stat-card icon="location_on" color="amber" label="Location" [value]="location || '—'" sub="Dealership location"/>
  </div>

  <!-- Sections -->
  <mat-tab-group class="dashboard-tabs">
    <mat-tab label="Overview">
      <div class="pt-5">
        <h2 class="text-xs font-semibold uppercase tracking-[0.12em] text-gray-400 mb-3">Quick Actions</h2>
        <div class="flex flex-wrap gap-3">
          <app-btn icon="add" routerLink="/cars/add">Add Car</app-btn>
          <app-btn variant="outline" icon="directions_car" routerLink="/cars">View Cars</app-btn>
          <app-btn variant="outline" icon="people" routerLink="/dealers/employees">Manage Employees</app-btn>
          <app-btn variant="outline" icon="settings" routerLink="/dealers/settings">Settings</app-btn>
        </div>
      </div>
    </mat-tab>

    <mat-tab label="Inventory">
      <div class="pt-5">
        <app-data-table [rows]="cars" emptyIcon="directions_car" emptyTitle="No cars yet"
                        emptyText="Add your first car to inventory."
                        emptyActionLink="/cars/add" emptyActionLabel="Add Car">
          <thead>
            <tr>
              <th>Make</th>
              <th>Model</th>
              <th>Year</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of cars">
              <td>
                <div class="flex items-center gap-3">
                  <app-avatar [name]="c.make" color="blue"/>
                  <span class="font-medium text-gray-900">{{ c.make }}</span>
                </div>
              </td>
              <td class="text-gray-600">{{ c.model }}</td>
              <td><span class="chip chip-brand">{{ c.modelYear }}</span></td>
            </tr>
          </tbody>
        </app-data-table>
      </div>
    </mat-tab>

    <mat-tab label="Team">
      <div class="pt-5">
        <app-data-table [rows]="employees" emptyIcon="people" emptyTitle="No employees yet"
                        emptyText="Invite team members to your dealership."
                        emptyActionLink="/dealers/employees" emptyActionLabel="Manage Employees">
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let e of employees">
              <td>
                <div class="flex items-center gap-3">
                  <app-avatar [name]="e.email" color="green"/>
                  <span class="font-medium text-gray-900">{{ e.email }}</span>
                </div>
              </td>
              <td class="text-gray-600">{{ e.role }}</td>
              <td>
                <span class="chip" [class.chip-green]="e.active !== false" [class.chip-red]="e.active === false">
                  {{ e.active === false ? 'Inactive' : 'Active' }}
                </span>
              </td>
            </tr>
          </tbody>
        </app-data-table>
      </div>
    </mat-tab>

    <mat-tab label="Activity Log">
      <div class="pt-5">
        <app-activity-log/>
      </div>
    </mat-tab>
  </mat-tab-group>

</div>
