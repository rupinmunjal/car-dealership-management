# ──────────────────────────────────────────────────────────────────
# Car Dealership Management — Base Configuration (shared across all profiles)
# ──────────────────────────────────────────────────────────────────
# Profile-specific overrides live in application-{profile}.yml.
# Active profiles:  local (default for dev),  prod
# ──────────────────────────────────────────────────────────────────

spring:
  # For local development, activate the "local" profile explicitly:
  #   SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
  # For production/Docker:
  #   SPRING_PROFILES_ACTIVE=prod

  jpa:
    open-in-view: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # File uploads / multipart
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── JWT ───────────────────────────────────────────────────────────
app:
  jwt:
    # Required — must be set via JWT_SECRET env var (see .env or .env.example).
    secret: ${JWT_SECRET}
    # Override via JWT_EXPIRATION_MS env var.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ── Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

# ── Logging defaults (profiles may override) ──────────────────────
logging:
  level:
    root: WARN
    ca.sheridancollege.munjalru: INFO
