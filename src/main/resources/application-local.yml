# ──────────────────────────────────────────────────────────────────
# Profile: local  (active by default)
# ──────────────────────────────────────────────────────────────────
# Purpose: Developer workstation — fast startup, verbose logs,
#          Swagger UI exposed, embedded H2 database.
# ──────────────────────────────────────────────────────────────────

spring:
  cache:
    type: simple

  data:
    redis:
      repositories:
        enabled: false

  datasource:
    url: jdbc:h2:mem:carsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# ── Developer-friendly logging ────────────────────────────────────
logging:
  level:
    root: INFO
    ca.sheridancollege.munjalru: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# ── Swagger / OpenAPI ─────────────────────────────────────────────
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

# ── CORS origins for Angular dev server ───────────────────────────
app:
  demo-data:
    password: ${DEMO_DATA_PASSWORD:Demo123!}
  cors:
    allowed-origins:
      - http://localhost:4200

management:
  health:
    redis:
      enabled: false
