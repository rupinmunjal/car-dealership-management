# ──────────────────────────────────────────────────────────────────
# Profile: prod
# ──────────────────────────────────────────────────────────────────
# Purpose: Production or staging deployment. Uses PostgreSQL,
#          minimal logging, Swagger UI disabled.
# ──────────────────────────────────────────────────────────────────

spring:
  cache:
    type: redis
    redis:
      time-to-live: 5m

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: false

# ── Production logging — errors only unless overridden ────────────
logging:
  level:
    root: WARN
    ca.sheridancollege.munjalru: WARN

# ── Swagger disabled in production ────────────────────────────────
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# ── CORS — restrict to known deployment origins ───────────────────
app:
  cors:
    allowed-origins:
      - http://localhost:8080
